post:
  tags:
    - Authentication
  summary: Send password reset email
  operationId: sendResetPasswordEmail
  description: |
    Send a password reset email to the user with a secure JWT token.
    The email contains a beautiful HTML template with a reset link that expires in 5 minutes.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
              description: Email address to send the reset link to
              example: 'john.doe@example.com'
  responses:
    '200':
      description: Reset email sent successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Reset password email has been successfully sent.'
              data:
                type: object
                example: {}
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation failed'
              data:
                type: string
                example: 'Email is required'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'User not found!'
              data:
                type: string
                example: 'User not found!'
    '500':
      description: Email sending failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Failed to send the email, please try again later.'
              data:
                type: string
                example: 'Failed to send the email, please try again later.'