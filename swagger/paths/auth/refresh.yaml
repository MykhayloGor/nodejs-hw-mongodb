post:
  tags:
    - Authentication
  summary: Refresh user session
  operationId: refreshSession
  description: |
    Refresh the user's session by generating new access and refresh tokens.
    Requires valid session cookies. The old session will be invalidated.
  security:
    - cookieAuth: []
  responses:
    '200':
      description: Session refreshed successfully
      headers:
        Set-Cookie:
          description: New session cookies
          schema:
            type: string
            example: 'sessionId=newAbc123; sessionToken=newXyz789; HttpOnly; Path=/'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: New JWT access token
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    '401':
      description: Session expired or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Session expired!'
              data:
                type: string
                example: 'Session expired!'
