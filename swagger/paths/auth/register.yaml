post:
  tags:
    - Authentication
  summary: Register a new user
  operationId: registerUser
  description: |
    Create a new user account with email and password.
    The email must be unique and password will be securely hashed.
  security: []  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              description: User's full name
              example: 'John Doe'
            email:
              type: string
              format: email
              description: User's email address (must be unique)
              example: 'john.doe@example.com'
            password:
              type: string
              minLength: 6
              description: User's password (will be hashed)
              example: 'securePassword123'
  responses:
    '201':
      description: User registered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: 'Successfully registered a user!'
              data:
                $ref: '../../components/schemas/User.yaml'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation failed'
              data:
                type: string
                example: 'Email is required'
    '409':
      description: Email already in use
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 409
              message:
                type: string
                example: 'User already registered!'
              data:
                type: string
                example: 'User already registered!'
