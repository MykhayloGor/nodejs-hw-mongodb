post:
  tags:
    - Authentication
  summary: Login user
  operationId: loginUser
  description: |
    Authenticate user with email and password.
    Returns an access token and sets session cookies.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              description: User's email address
              example: 'john.doe@example.com'
            password:
              type: string
              description: User's password
              example: 'securePassword123'
  responses:
    '200':
      description: User logged in successfully
      headers:
        Set-Cookie:
          description: Session cookies for authentication
          schema:
            type: string
            example: 'sessionId=abc123; sessionToken=xyz789; HttpOnly; Path=/'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully logged in a user!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for API authentication
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation failed'
              data:
                type: string
                example: 'Email is required'
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'User login and password does not match!'
              data:
                type: string
                example: 'User login and password does not match!'
