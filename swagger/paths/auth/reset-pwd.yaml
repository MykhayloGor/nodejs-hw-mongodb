post:
  tags:
    - Authentication
  summary: Reset user password
  operationId: resetPassword
  description: |
    Reset user's password using the JWT token received via email.
    The token expires in 5 minutes for security. After successful reset,
    all existing sessions for the user will be invalidated.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
            - password
          properties:
            token:
              type: string
              description: JWT token from the password reset email
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            password:
              type: string
              minLength: 6
              description: New password for the user
              example: 'newSecurePassword123'
  responses:
    '200':
      description: Password reset successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Password has been successfully reset.'
              data:
                type: object
                example: {}
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation failed'
              data:
                type: string
                example: 'Password is required'
    '401':
      description: Token expired or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Token is expired or invalid.'
              data:
                type: string
                example: 'Token is expired or invalid.'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'User not found!'
              data:
                type: string
                example: 'User not found!'
