patch:
  tags:
    - Contacts
  summary: Update contact
  operationId: updateContact
  description: |
    Update an existing contact with optional photo upload.
    Only the fields provided in the request will be updated.
    If a photo is uploaded, it will replace the existing photo in Cloudinary.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Unique identifier of the contact to update
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: '507f1f77bcf86cd799439011'
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Full name of the contact
              example: 'John Updated'
            phoneNumber:
              type: string
              description: Phone number of the contact
              example: '+9876543210'
            email:
              type: string
              format: email
              description: Email address of the contact
              example: 'john.updated@example.com'
            contactType:
              type: string
              enum: [work, home, personal]
              description: Type/category of the contact
              example: 'work'
            isFavourite:
              type: boolean
              description: Whether the contact is marked as favourite
              example: true
            photo:
              type: string
              format: binary
              description: Contact photo (image file). Will replace existing photo if provided
  responses:
    '200':
      description: Contact updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully patched a contact!'
              data:
                $ref: '../../../components/schemas/Contact.yaml'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation failed'
              data:
                type: string
                example: 'Invalid email format'
    '401':
      $ref: '../../../components/responses/UnauthorizedError.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'Contact not found'
              data:
                type: string
                example: 'Contact not found'