delete:
  tags:
    - Contacts
  summary: Delete contact
  operationId: deleteContact
  description: |
    Delete a contact permanently. This action cannot be undone.
    If the contact has a photo, it will also be removed from Cloudinary.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Unique identifier of the contact to delete
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: '507f1f77bcf86cd799439011'
  responses:
    '204':
      description: Contact deleted successfully (no content returned)
    '401':
      $ref: '../../../components/responses/UnauthorizedError.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'Contact not found'
              data:
                type: string
                example: 'Contact not found'