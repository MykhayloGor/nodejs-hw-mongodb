get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: |
    Retrieve a paginated list of contacts belonging to the authenticated user.
    Supports filtering, sorting, and pagination.
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    - name: perPage
      in: query
      description: Number of contacts per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    - name: sortBy
      in: query
      description: Field to sort contacts by
      required: false
      schema:
        type: string
        enum: [name, phoneNumber, email, contactType, createdAt, updatedAt, _id]
        default: '_id'
        example: 'name'
    - name: sortOrder
      in: query
      description: Sort order (ascending or descending)
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: 'asc'
        example: 'asc'
    - name: isFavourite
      in: query
      description: Filter contacts by favourite status
      required: false
      schema:
        type: boolean
        example: true
    - name: contactType
      in: query
      description: Filter contacts by type
      required: false
      schema:
        type: string
        enum: [work, home, personal]
        example: 'personal'
  responses:
    '200':
      description: Contacts retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully found contacts!'
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/Contact.yaml'
                  page:
                    type: integer
                    description: Current page number
                    example: 1
                  perPage:
                    type: integer
                    description: Number of items per page
                    example: 10
                  totalItems:
                    type: integer
                    description: Total number of contacts
                    example: 25
                  totalPages:
                    type: integer
                    description: Total number of pages
                    example: 3
                  hasNextPage:
                    type: boolean
                    description: Whether there is a next page
                    example: true
                  hasPreviousPage:
                    type: boolean
                    description: Whether there is a previous page
                    example: false
    '401':
      $ref: ../../components/responses/UnauthorizedError.yaml